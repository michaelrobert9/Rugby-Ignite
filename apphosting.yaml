# Firebase App Hosting configuration.
# https://firebase.google.com/docs/app-hosting/configure
#
# App Hosting builds and runs this Next.js app on every push to the connected
# branch (main). See DEPLOY.md.

runConfig:
  minInstances: 0
  maxInstances: 2
  cpu: 1
  memoryMiB: 512

# PREVIEW MODE (current): no database secret is attached, so the app serves the
# bundled historical data via the in-memory demo backend (src/lib/data/localStore.ts).
# Every page renders with real data; admin edits are NOT persisted. This lets the
# site deploy to a live URL with zero credential setup.
#
# TO SWITCH TO THE LIVE FIRESTORE DATABASE later, uncomment the block below AND
# make sure the Secret Manager secret FIREBASE_SERVICE_ACCOUNT_KEY holds valid
# service-account JSON. The most reliable way to set it (avoids paste mangling):
#
#   firebase apphosting:secrets:set FIREBASE_SERVICE_ACCOUNT_KEY \
#     --data-file /path/to/serviceAccountKey.json --project match-pulse-4560e
#
# env:
#   - variable: SERVICE_ACCOUNT_KEY
#     secret: FIREBASE_SERVICE_ACCOUNT_KEY
#     availability:
#       - RUNTIME
