# Firebase App Hosting configuration.
# https://firebase.google.com/docs/app-hosting/configure
#
# App Hosting builds and runs this Next.js app on every push to the connected
# branch (main). See DEPLOY.md.

runConfig:
  minInstances: 0
  maxInstances: 2
  cpu: 1
  memoryMiB: 512

# PERSISTENCE (active): this app stores its OWN data — ranking settings, pages,
# posts — in a DEDICATED Firestore database ("rugby-ignite"), kept separate from
# the Match Pulse core's (default) database so the two never collide. It is
# reached with Application Default Credentials (no service-account key needed),
# exactly like the live sport reads. The live rankings still read the Match Pulse
# sport databases read-only.
env:
  - variable: APP_FIRESTORE_DB
    value: rugby-ignite
    availability:
      - RUNTIME

# ALTERNATIVE (not used): an explicit service-account key. If ever needed, set the
# secret and add SERVICE_ACCOUNT_KEY here — but KEEP APP_FIRESTORE_DB above so the
# app still writes to its own database, never the core (default) one.
#
#   firebase apphosting:secrets:set FIREBASE_SERVICE_ACCOUNT_KEY \
#     --data-file /path/to/serviceAccountKey.json --project match-pulse-4560e
#
#   - variable: SERVICE_ACCOUNT_KEY
#     secret: FIREBASE_SERVICE_ACCOUNT_KEY
#     availability:
#       - RUNTIME
