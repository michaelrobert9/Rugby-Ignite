# Firebase App Hosting configuration.
# https://firebase.google.com/docs/app-hosting/configure
#
# App Hosting builds and runs this Next.js app on every push to the connected
# branch (main). See DEPLOY.md.

runConfig:
  minInstances: 0
  maxInstances: 2
  cpu: 1
  memoryMiB: 512

# PREVIEW MODE (current): no database is attached, so the app serves the bundled
# historical data via the in-memory demo backend (src/lib/data/localStore.ts).
# Every page renders with real data; admin edits (including ranking settings) are
# NOT persisted and reset when the instance restarts.
#
# TO PERSIST THIS APP'S OWN DATA (ranking settings, pages, posts) — RECOMMENDED:
# create a DEDICATED Firestore database in the same project (e.g. id
# "rugby-ignite") so it never collides with the Match Pulse core's (default)
# database, then set APP_FIRESTORE_DB to that id. No key is needed — App Hosting
# reaches it with Application Default Credentials, exactly like the live sport
# reads. Uncomment:
#
# env:
#   - variable: APP_FIRESTORE_DB
#     value: rugby-ignite
#     availability:
#       - RUNTIME
#
# ALTERNATIVELY, point the app at a store via an explicit service-account key
# (uncomment BOTH the block above's style and this, with the secret set):
#
#   firebase apphosting:secrets:set FIREBASE_SERVICE_ACCOUNT_KEY \
#     --data-file /path/to/serviceAccountKey.json --project match-pulse-4560e
#
# env:
#   - variable: SERVICE_ACCOUNT_KEY
#     secret: FIREBASE_SERVICE_ACCOUNT_KEY
#     availability:
#       - RUNTIME
